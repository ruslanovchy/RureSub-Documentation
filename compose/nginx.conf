worker_processes  1;

events {
    worker_connections  1024;
}

http {
    upstream frontend {
        server frontend:80;
    }

    upstream identity {
        server ruresub_identity:8080;
    }

    upstream profiles {
        server ruresub_profiles:8080;
    }

    upstream minio {
        server minio:9000;
    }

    upstream posts_writer {
        server ruresub_posts_writer:8080;
    }

    upstream posts_reader {
        server ruresub_posts_reader:8080;
    }

    upstream posts_likes {
        server ruresub_posts_likes:8080;
    }

    upstream posts_comments {
        server ruresub_posts_comments:8080;
    }

    upstream posts_followers {
        server ruresub_followers:8080;
    }

    map $http_x_forwarded_proto $real_scheme {
        default $scheme;
        https   https;
    }

    server {
        listen 80;
        server_name prudently-pseudoofficial-josefina.ngrok-free.dev www.prudently-pseudoofficial-josefina.ngrok-free.dev;
        proxy_redirect http://$host/ https://$host/;

        location / {
            proxy_pass http://frontend/;
            
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_scheme;
        }

        location /api/auth {
            proxy_pass http://identity/;

            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_scheme;
        }
        location /api/auth/ {
            proxy_pass http://identity/;

            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_scheme;
        }

        location /api/profile {
            proxy_pass http://profiles/;

            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_scheme;
        }
        location /api/profile/ {
            proxy_pass http://profiles/;

            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_scheme;
        }

        location /api/storage/ {
            proxy_pass http://minio/;
            
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_scheme;
        }

        location /api/posts/ {
            proxy_pass http://posts_reader/;
            client_max_body_size 1G;

            if ($request_method ~* "(POST|PUT|DELETE|PATCH)") {
                rewrite ^/api/posts/(.*)$ /$1 break;
                
                proxy_pass http://posts_writer;
            }
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection keep-alive;
            proxy_set_header   Host $host;
            proxy_cache_bypass $http_upgrade;
            
            # Вот эти три строки критически важны:
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $real_scheme;
        }

        location /api/posts/likes/ {
            proxy_pass http://posts_likes/;
            
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_scheme;
        }

        location /api/posts/comments/ {
            proxy_pass http://posts_comments/;
            
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_scheme;
        }

        location /api/posts/comments {
            proxy_pass http://posts_comments/;
            
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_scheme;
        }

        location /api/followers/ {
            proxy_pass http://posts_followers/;
            
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_scheme;
        }

        location /api/followers {
            proxy_pass http://posts_followers/;
            
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_scheme;
        }
    }
}
